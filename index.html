<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Pocket Dimension</title>
<style>
  :root { --ink:#e8ecf4; --dim:#8d97ad; --line:rgba(160,185,230,.16); --glass:rgba(8,12,24,.62); --accent:#9bd0ff; --warm:#ffd27a; --bad:#ff7a6b; }
  * { box-sizing: border-box; }
  html,body { margin:0; height:100%; overflow:hidden; background:#02030a; color:var(--ink); font:13px/1.45 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  canvas#view { position:fixed; inset:0; width:100%; height:100%; display:block; touch-action:none; }
  #labels { position:fixed; inset:0; pointer-events:none; overflow:hidden; }
  .label { position:absolute; left:0; top:0; font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:#f4f1e6; text-shadow:0 0 6px #000,0 0 2px #000; white-space:nowrap; }
  .label.cap { font-weight:600; color:#fff4d6; } .label.cap::before { content:'★ '; color:var(--warm); }
  .label.body { color:#b9d4ff; font-size:10px; letter-spacing:.18em; }
  .selmark { position:absolute; left:0; top:0; border:2px solid #fff1b0; border-radius:50%; box-shadow:0 0 10px rgba(255,241,176,.6); display:none; pointer-events:none; animation:pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 50% { border-color: rgba(255,241,176,.45); } }
  .ping { position:absolute; left:0; top:0; border:2px solid #ffd27a; border-radius:50%; pointer-events:none; }
  .glass { background:var(--glass); backdrop-filter:blur(14px) saturate(1.2); -webkit-backdrop-filter:blur(14px) saturate(1.2); border:1px solid var(--line); border-radius:12px; }
  #ui.hidden > :not(#menu):not(#loading) { opacity:0; pointer-events:none; }
  #top { position:fixed; left:16px; top:14px; display:flex; flex-direction:column; gap:2px; text-shadow:0 0 8px #000; }
  #top .title { font-size:11px; letter-spacing:.38em; color:var(--dim); text-transform:uppercase; }
  #top .year { font-size:30px; font-weight:200; letter-spacing:.08em; }
  #top .sub { color:var(--dim); font-size:12px; }
  #top .sub b { color:var(--ink); font-weight:500; }
  #top button.link { background:none; border:0; color:var(--dim); font:inherit; cursor:pointer; padding:0; text-decoration:underline dotted; }
  #bar { position:fixed; left:50%; bottom:18px; transform:translateX(-50%); display:flex; gap:4px; padding:6px; align-items:center; }
  #bar button, .btn { background:transparent; color:var(--ink); border:1px solid transparent; padding:7px 10px; border-radius:8px; font:inherit; cursor:pointer; letter-spacing:.04em; }
  #bar button:hover, .btn:hover { background:rgba(155,208,255,.12); }
  #bar button.on { background:rgba(155,208,255,.2); border-color:rgba(155,208,255,.5); color:#fff; }
  #bar .sep { width:1px; align-self:stretch; background:var(--line); margin:0 6px; }
  #bar .eff { color:var(--dim); font-size:11px; padding:0 6px; min-width:84px; text-align:center; }
  @media (max-width:1040px){ #bar .eff,#bar .sep{display:none} #help{display:none} #feed{width:260px} #panel{width:min(360px,60vw)} }
  #jump { position:absolute; bottom:56px; left:50%; transform:translateX(-50%); display:none; padding:6px; gap:4px; }
  #jump.open { display:flex; }
  #progress { position:fixed; left:50%; bottom:76px; transform:translateX(-50%); padding:8px 14px; display:none; min-width:260px; text-align:center; }
  #progress .b { height:3px; background:var(--line); margin-top:6px; border-radius:2px; overflow:hidden; } #progress .b i { display:block; height:100%; background:var(--accent); width:0; }
  #feed { position:fixed; left:16px; bottom:18px; width:340px; display:flex; flex-direction:column; gap:6px; pointer-events:none; }
  .ev { pointer-events:auto; cursor:pointer; padding:8px 11px; font-size:12px; border-radius:10px; animation:in .5s ease both; }
  .ev .y { color:var(--warm); font-size:10px; letter-spacing:.14em; text-transform:uppercase; }
  .ev .c { color:var(--dim); font-size:11px; margin-top:2px; }
  .ev.t3 { border-color:rgba(255,210,122,.5); }
  @keyframes in { from { opacity:0; transform:translateY(8px);} to { opacity:1; transform:none;} }
  #panel { position:fixed; right:16px; top:14px; bottom:84px; width:360px; padding:14px 16px; overflow:auto; display:none; scrollbar-width:thin; }
  #panel.open { display:block; }
  #panel h2 { margin:0 0 2px; font-weight:300; font-size:22px; letter-spacing:.03em; }
  #panel h3 { margin:16px 0 6px; font-size:10px; font-weight:600; letter-spacing:.24em; text-transform:uppercase; color:var(--dim); border-top:1px solid var(--line); padding-top:10px; }
  #panel .close { position:absolute; right:10px; top:8px; background:none; border:0; color:var(--dim); font-size:18px; cursor:pointer; }
  #panel .kv { display:grid; grid-template-columns:auto 1fr; gap:1px 12px; } #panel .kv span:nth-child(odd) { color:var(--dim); font-size:11px; letter-spacing:.12em; text-transform:uppercase; }
  .bar { display:grid; grid-template-columns:104px 1fr 34px; align-items:center; gap:8px; font-size:12px; } .bar i { height:5px; border-radius:3px; background:rgba(255,255,255,.08); display:block; position:relative; overflow:hidden; } .bar i b { position:absolute; inset:0 auto 0 0; background:linear-gradient(90deg,#5aa9ff,#9bd0ff); border-radius:3px; } .bar em { color:var(--dim); font-style:normal; text-align:right; font-size:11px; }
  pre.tree { margin:0; font:12px/1.35 ui-monospace,SFMono-Regular,Menlo,monospace; color:#cfd8ea; white-space:pre; overflow:auto; }
  a.l, .l { color:var(--accent); cursor:pointer; text-decoration:none; border-bottom:1px dotted rgba(155,208,255,.4); }
  .mem { font-size:12px; margin:3px 0; } .mem .yr { color:var(--dim); font-size:10px; letter-spacing:.1em; }
  .pos { color:#9be8b0; } .neg { color:var(--bad); }
  .chip { display:inline-block; padding:1px 8px; border:1px solid var(--line); border-radius:99px; margin:2px 3px 2px 0; font-size:11px; color:var(--dim); }
  .chip.on { color:var(--ink); border-color:rgba(155,208,255,.5); background:rgba(155,208,255,.12); cursor:pointer; }
  .row { display:flex; gap:6px; flex-wrap:wrap; margin-top:8px; }
  .btn { border:1px solid var(--line); }
  #almanac { position:fixed; inset:5% 6%; display:none; padding:16px 20px; overflow:hidden; flex-direction:column; }
  #almanac.open { display:flex; }
  #almanac .tabs { display:flex; gap:4px; margin-bottom:10px; } #almanac .tabs button { flex:0; }
  #almanac .body { overflow:auto; flex:1; padding-right:8px; scrollbar-width:thin; }
  #almanac .x { position:absolute; right:14px; top:10px; background:none; border:0; color:var(--dim); font-size:20px; cursor:pointer; }
  #almanac table { width:100%; border-collapse:collapse; } #almanac td, #almanac th { text-align:left; padding:4px 10px 4px 0; border-bottom:1px solid var(--line); font-weight:400; vertical-align:top; } #almanac th { color:var(--dim); font-size:10px; letter-spacing:.16em; text-transform:uppercase; }
  .hist { margin:0 0 9px; } .hist .y { color:var(--warm); font-size:10px; letter-spacing:.16em; } .hist .t { white-space:pre-line; } .hist .c { color:var(--dim); font-size:11px; }
  #dev { position:fixed; left:16px; top:110px; width:330px; padding:10px 12px; display:none; font:11px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace; max-height:calc(100% - 220px); overflow:auto; }
  #dev.open { display:block; } #dev .k { color:var(--dim); } #dev .g { display:grid; grid-template-columns:1fr auto; } #dev h4 { margin:8px 0 3px; color:var(--accent); font-weight:500; letter-spacing:.14em; font-size:10px; }
  #dev .log div { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; color:#aab4cc; }
  #menu, #loading { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; background:radial-gradient(ellipse at 50% 40%, rgba(20,34,70,.55), rgba(2,3,10,.96) 70%); z-index:50; }
  #menu .card { width:min(520px,90vw); text-align:center; }
  #menu h1 { font-weight:100; letter-spacing:.5em; font-size:30px; margin:0 0 6px; text-indent:.5em; }
  #menu p { color:var(--dim); margin:0 0 22px; line-height:1.6; }
  #menu input { width:100%; padding:11px 14px; background:rgba(255,255,255,.05); border:1px solid var(--line); border-radius:9px; color:var(--ink); font:inherit; font-size:15px; text-align:center; letter-spacing:.08em; margin-bottom:10px; }
  #menu .btn { width:100%; padding:12px; margin-top:6px; background:rgba(155,208,255,.14); border-color:rgba(155,208,255,.4); font-size:14px; letter-spacing:.2em; text-transform:uppercase; }
  #menu .btn.alt { background:transparent; border-color:var(--line); color:var(--dim); }
  #menu small { display:block; margin-top:18px; color:#5d667b; line-height:1.6; }
  #loading { z-index:60; flex-direction:column; gap:12px; text-align:center; background:#02030a; } #loading .t { letter-spacing:.34em; font-size:11px; text-transform:uppercase; color:var(--dim); } #loading .s { font-size:13px; min-height:20px; }
  #toast { position:fixed; top:20%; left:50%; transform:translateX(-50%); text-align:center; font-weight:200; font-size:20px; letter-spacing:.08em; text-shadow:0 0 18px #000, 0 0 4px #000; opacity:0; transition:opacity 1.2s; pointer-events:none; max-width:70vw; } #toast.on { opacity:1; }
  #help { position:fixed; right:16px; bottom:18px; color:var(--dim); font-size:11px; text-align:right; pointer-events:none; line-height:1.6; opacity:.8 }
  kbd { background:rgba(255,255,255,.08); border-radius:4px; padding:0 5px; font:inherit; }
</style>
</head>
<body>
<canvas id="view"></canvas>
<div id="labels"></div>
<div id="ui">
  <div id="top"></div>
  <div id="toast"></div>
  <div id="feed"></div>
  <div id="panel" class="glass"></div>
  <div id="progress" class="glass"></div>
  <div id="bar" class="glass"></div>
  <div id="dev" class="glass"></div>
  <div id="almanac" class="glass"></div>
  <div id="help"></div>
  <div id="menu"></div>
  <div id="loading" style="display:none"></div>
</div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
